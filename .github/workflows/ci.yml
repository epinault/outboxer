name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "27.3"
          - elixir: "1.20.4"
            otp: "29.0"
            lint: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outboxer_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Credo
        if: matrix.lint
        run: mix credo --strict

      # SQLite and Postgres, relays against fake clients. The integration
      # tests (real Kafka and SQS) are run locally with `mix test.integration`.
      - name: Test
        run: mix test

      - name: Relays stay optional
        run: MIX_ENV=dev mix do deps.get + compile --no-optional-deps --warnings-as-errors

      - name: Hex package builds
        if: matrix.lint
        run: MIX_ENV=dev mix hex.build
