# Local infrastructure for the test suite.
#
#   docker compose up -d postgres     # enough for `mix test`
#   docker compose up -d              # everything, for `mix test.integration`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: outboxer_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Single-node Kafka (KRaft, no ZooKeeper). The image's defaults advertise
  # localhost:9092, which is what the integration tests connect to.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"

  # MiniStack: a free, open-source LocalStack alternative. Used for SQS.
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
